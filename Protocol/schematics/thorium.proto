syntax = "proto3";

package thorium;

enum EventType {
	UNKNOWN = 0;
	AUTH_REQUEST = 1;
	TEXT_MESSAGE = 2;
	FILE_TRANSFERT = 3;
	READ_RECEIPT = 4;
}

message QuicEnvolope {
	EventType type = 1;
	uint64 timestamp = 2;
	string sender_id = 3;
	string destination_id = 4;

	bytes encrypted_payload = 5;
}
