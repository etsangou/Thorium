syntax = "proto3";

package thorium;

enum EventType {
	EVENT_UNKNOWN = 0;
	EVENT_AUTH_REQUEST = 1;
	EVENT_TEXT_MESSAGE = 2;
	EVENT_FILE_TRANSFER = 3;
	EVENT_READ_RECEIPT = 4;
}

message QuicEnvelope {
	EventType type = 1;
	uint64 timestamp = 2;
	string sender_id = 3;
	string destination_id = 4;

	bytes encrypted_payload = 5;
}
